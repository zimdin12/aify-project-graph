<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aify-project-graph</title>
  <!-- Vendored locally (served by dashboard server from node_modules). No CDN
       dependency — avoids Edge-freeze on cold loads when unpkg hangs.
       Load order matters: layout-base → cose-base → cytoscape → fcose/dagre. -->
  <script src="/vendor/layout-base.js"></script>
  <script src="/vendor/cose-base.js"></script>
  <script src="/vendor/cytoscape.min.js"></script>
  <script src="/vendor/cytoscape-fcose.js"></script>
  <script src="/vendor/cytoscape-dagre.js"></script>
  <script src="/vendor/cytoscape-expand-collapse.js"></script>
  <script src="/vendor/3d-force-graph.min.js"></script>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel2: #11161d; --border: #283039;
      --border-hi: #3d444d; --text: #c9d1d9; --muted: #8b949e; --faint: #6e7681;
      --accent: #58a6ff; --accent-bg: #12233b; --good: #3fb950; --warn: #d29922; --bad: #da3633;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    #sidebar { width: 340px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; transition: width 160ms ease, border-color 160ms ease; flex: 0 0 auto; }
    body.sidebar-collapsed #sidebar { width: 0; border-right-color: transparent; }
    #sidebar h1 { font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--accent); display:flex; align-items:center; gap:8px; }
    #sidebar h1 .logo { width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#58a6ff,#a371f7); }
    #sidebar .mode-line { padding: 7px 16px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #sidebar .mode-line a { color: var(--accent); text-decoration: none; }
    #sidebar .mode-line a:hover { text-decoration: underline; }
    #sidebar-body { flex: 1; overflow-y: auto; min-height: 0; }
    #sidebar-body::-webkit-scrollbar { width: 9px; }
    #sidebar-body::-webkit-scrollbar-thumb { background: #283039; border-radius: 6px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    #sidebar-toggle, #sidebar-reopen { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 11px; }
    #sidebar-toggle:hover, #sidebar-reopen:hover { border-color: var(--accent); }
    #sidebar-reopen { position: absolute; top: 12px; left: 12px; z-index: 12; display: none; }
    body.sidebar-collapsed #sidebar-reopen { display: inline-flex; }

    #search-box { padding: 10px 16px; border-bottom: 1px solid var(--border); position: relative; }
    #search-box input { width: 100%; padding: 7px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; }
    #search-box input:focus { outline: none; border-color: var(--accent); }
    #search-results { position:absolute; left:16px; right:16px; top:46px; background:#1b222b; border:1px solid var(--border-hi); border-radius:8px; z-index:30; max-height:260px; overflow-y:auto; display:none; box-shadow:0 8px 24px #0008; }
    #search-results .sr { padding:7px 10px; cursor:pointer; font-size:12px; border-bottom:1px solid #21262d; }
    #search-results .sr:last-child { border-bottom:none; }
    #search-results .sr:hover, #search-results .sr.sel { background: var(--accent-bg); }
    #search-results .sr .sr-sub { color: var(--faint); font-size:11px; }

    .section-title { margin: 12px 0 7px; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
    #stats { padding: 12px 16px 4px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    #stats .stat { display: flex; justify-content: space-between; padding: 2px 0; gap: 8px; }
    #stats .stat-value { color: var(--text); font-weight: 600; text-align: right; }

    #controls { padding: 4px 16px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .subtle { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .toggle-pill { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 11px; user-select:none; }
    /* Guided Tour (borrow: understand-anything LearnPanel) */
    #tour-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
    #tour-panel { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--bg); }
    .tour-head { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; }
    .tour-prog { color: var(--muted); font-weight:400; font-size:11px; }
    .tour-x { margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; }
    .tour-title { margin-top:6px; font-weight:600; font-size:13px; }
    .tour-why { color: var(--muted); font-size:12px; margin:3px 0 6px; }
    .tour-pills { display:flex; flex-wrap:wrap; gap:4px; }
    .tour-pill { padding:3px 8px; border-radius:999px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer; font-size:11px; }
    .tour-pill:hover { border-color: var(--accent, #3fb950); }
    .tour-verb { margin-top:7px; font-size:11px; color:var(--faint,#888); }
    .tour-nav { display:flex; gap:6px; margin-top:8px; }
    .tour-nav button { flex:1; padding:4px; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:6px; cursor:pointer; font-size:12px; }
    .tour-nav button:disabled { opacity:.4; cursor:default; }
    /* Inline source viewer */
    .src-box { margin-top:8px; border:1px solid var(--border); border-radius:6px; overflow:auto; max-height:340px; background:#0d1117; font-size:11px; }
    .src-row { display:flex; gap:8px; white-space:pre; font-family:ui-monospace,Menlo,Consolas,monospace; }
    .src-ln { color:var(--faint,#666); text-align:right; min-width:34px; user-select:none; padding:0 4px; }
    .src-row code { color:var(--text); }
    #cap-note { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5; background:rgba(187,135,0,0.14); border:1px solid #bf8700; color:var(--text); padding:5px 12px; border-radius:6px; font-size:12px; max-width:70%; text-align:center; }
    .nav-back-bar { margin-bottom:6px; }
    .nav-back-btn { background:var(--bg); border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 9px; cursor:pointer; font-size:11px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nav-back-btn:hover { border-color:var(--accent); color:var(--text); }
    #node-tip { position:absolute; z-index:8; pointer-events:none; background:#161b22; border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:6px; font-size:11px; max-width:280px; line-height:1.5; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
    /* File-tree explorer */
    #files-btn { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:2px 8px; cursor:pointer; font-size:12px; }
    #files-panel { border:1px solid var(--border); border-radius:8px; padding:8px; margin:8px 0; background:var(--bg); max-height:340px; overflow:auto; }
    .ftree-row { display:flex; align-items:center; gap:3px; font-size:12px; padding:1px 2px; cursor:pointer; white-space:nowrap; border-radius:4px; }
    .ftree-row:hover { background:#21262d; }
    .ftree-dir { color:var(--text); font-weight:500; }
    .ftree-file { color:var(--muted); }
    .ftree-tw { width:11px; display:inline-block; color:var(--faint); }
    .toggle-pill.active { border-color: var(--accent); background: var(--accent-bg); color: #cfe5ff; }
    .toggle-pill:hover { border-color: var(--accent); }
    .view-pill { display:flex; align-items:center; gap:5px; padding: 6px 11px; font-size:12px; }
    .view-pill .ic { font-size:13px; line-height:1; }
    .mini-button { padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 11px; }
    .mini-button:hover { border-color: var(--accent); }
    .btn-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .ctl-group { margin-top: 4px; }
    details.fold { margin-top: 10px; border:1px solid var(--border); border-radius:8px; background: var(--panel2); }
    details.fold > summary { cursor:pointer; padding:8px 10px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); list-style:none; user-select:none; }
    details.fold > summary::-webkit-details-marker { display:none; }
    details.fold > summary::before { content:'▸ '; color:var(--faint); }
    details.fold[open] > summary::before { content:'▾ '; }
    details.fold > .fold-body { padding: 4px 10px 10px; }
    input.mini-input { padding:5px 7px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:11px; }
    .slider-row { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:11px; color:var(--muted); }
    .slider-row input[type=range] { flex:1; accent-color: var(--accent); }

    #node-detail { padding: 12px 16px; font-size: 12px; overflow-wrap: anywhere; }
    #node-detail h3 { color: var(--accent); margin-bottom: 8px; font-size: 14px; }
    #node-detail .field { padding: 3px 0; line-height: 1.5; }
    #node-detail .field-label { color: var(--muted); }
    #node-detail .list { display: flex; flex-direction: column; gap: 4px; }
    #node-detail .list-item { padding: 6px 8px; border: 1px solid #21262d; border-radius: 6px; background: var(--bg); }
    #node-detail .edge-item { padding: 6px 8px; border: 1px solid #21262d; border-radius: 6px; background: var(--bg); cursor: pointer; }
    #node-detail .edge-item:hover { color: var(--accent); border-color: var(--accent); }
    #node-detail .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    #node-detail .tag-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #1f2937; border: 1px solid var(--border); color: var(--text); font-size: 11px; }
    #node-detail .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 11px; background: var(--bg); }
    #node-detail .code-block { margin-top: 6px; padding: 8px; background: var(--bg); border: 1px solid #21262d; border-radius: 6px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
    #node-detail .trust-meter { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    #node-detail .trust-bar { flex: 1; height: 8px; border-radius: 999px; background: #21262d; overflow: hidden; }
    #node-detail .trust-bar-fill { height: 100%; background: linear-gradient(90deg, #da3633, #d29922, #3fb950); }
    #node-detail .detail-card { padding: 10px; border: 1px solid #21262d; border-radius: 8px; background: var(--bg); margin-bottom: 10px; }

    #graph-container { flex: 1; position: relative; min-width: 0; }
    #cy, #fg3d { width: 100%; height: 100%; }
    #fg3d { display: none; }

    /* top-center breadcrumb / context bar */
    #ctxbar { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:#161b22e6; border:1px solid var(--border-hi); border-radius:999px; padding:5px 8px 5px 14px; font-size:12px; z-index:11; max-width:70%; backdrop-filter: blur(4px); }
    #ctxbar .crumb { color: var(--muted); }
    #ctxbar .crumb b { color: var(--text); }
    #ctxbar .crumb-btn { cursor:pointer; color: var(--accent); }
    #ctxbar .x { cursor:pointer; border:1px solid var(--border); border-radius:999px; padding:1px 8px; color:var(--muted); }
    #ctxbar .x:hover { border-color: var(--accent); color: var(--text); }

    /* floating canvas toolbar (zoom / fit / expand) */
    #canvas-tools { position:absolute; bottom:14px; left:14px; display:flex; flex-direction:column; gap:6px; z-index:11; }
    #canvas-tools button { width:34px; height:34px; border-radius:8px; border:1px solid var(--border-hi); background:#161b22e6; color:var(--text); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(4px); }
    #canvas-tools button:hover { border-color: var(--accent); color:#fff; }

    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--muted); font-size:13px; background:var(--bg); z-index:40; }
    #loading .spin { width:34px;height:34px;border:3px solid #283039;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    #legend { position: absolute; bottom: 12px; right: 12px; background: #161b22ee; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 11px; max-width: 248px; max-height: 56vh; overflow-y:auto; }
    #legend .lg-title { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:4px 0 3px; }
    #legend .item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    #legend .swatch { width: 12px; height: 12px; border: 1px solid var(--border); flex: 0 0 auto; }
    #legend .dot { border-radius: 50%; }
    #legend .line { width: 18px; height: 0; border-top: 2px solid; flex: 0 0 auto; }
    #legend.collapsed .lg-body { display:none; }
    #legend .lg-head { cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

    .banner { position:absolute; top:54px; left:50%; transform:translateX(-50%); background:#3a2d0e; border:1px solid #cba94a; color:#f0d58c; padding:8px 14px; border-radius:6px; font-size:12px; max-width:720px; z-index:10; line-height:1.4; text-align:center; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1><span class="logo"></span> aify-project-graph</h1>
    <div class="mode-line">
      <span id="mode-label">2D map</span>
      <div class="header-actions">
        <button id="tour-btn" type="button" title="Guided tour of this codebase">🧭 Tour</button>
        <button id="files-btn" type="button" title="Browse files (folder tree)">📁 Files</button>
        <a id="mode-link" href="/3d">open 3D</a>
        <button id="sidebar-toggle" type="button">hide</button>
      </div>
    </div>
    <div id="sidebar-body">
      <div id="search-box">
        <input type="text" id="search" placeholder="Search symbols, files, features…" autocomplete="off" />
        <div id="search-results"></div>
      </div>
      <div id="stats">Loading…</div>
      <div id="tour-panel" style="display:none"></div>
      <div id="files-panel" style="display:none"></div>
      <div id="controls"></div>
      <div id="node-detail"><p style="color: var(--muted);">Click a node to inspect it.</p></div>
    </div>
  </div>
  <div id="graph-container">
    <button id="sidebar-reopen" type="button">show panel</button>
    <div id="cy"></div>
    <div id="fg3d"></div>
    <div id="ctxbar" style="display:none"></div>
    <div id="cap-note" style="display:none"></div>
    <div id="node-tip" style="display:none"></div>
    <div id="canvas-tools">
      <button id="t-fit" title="Fit to screen (F)">⊡</button>
      <button id="t-zin" title="Zoom in">＋</button>
      <button id="t-zout" title="Zoom out">－</button>
      <button id="t-expand" title="Expand all groups">⊕</button>
      <button id="t-collapse" title="Collapse all groups">⊖</button>
      <button id="t-export" title="Export current view as PNG">⤓</button>
    </div>
    <div id="loading"><div class="spin"></div><div id="loading-text">Building graph…</div></div>
    <div id="legend"></div>
  </div>
  <script>
    // ───────────────────────── palette / shape config ─────────────────────────
    const LAYER_COLORS = { code: '#8b949e', feature: '#58a6ff', task: '#d29922', doc: '#3fb950' };
    const LAYER_SHAPES = { code: 'ellipse', feature: 'round-rectangle', task: 'diamond', doc: 'hexagon' };
    const TYPE_COLORS = {
      Function: '#58a6ff', Method: '#388bfd', Test: '#7ee787',
      Class: '#f0883e', Interface: '#f0883e', Type: '#ffa657', Struct: '#f0883e',
      File: '#3fb950', Module: '#56d364', Directory: '#8b949e',
      Route: '#bc8cff', Entrypoint: '#bc8cff',
      External: '#d29922', Config: '#a5a5a5', Document: '#3fb950',
      Schema: '#8b949e', Variable: '#6e7681', Symbol: '#6e7681',
      Repository: '#da3633', ShaderBinding: '#bc8cff',
    };
    const KIND_SHAPES = { ShaderBinding: 'triangle', Entrypoint: 'star', Class: 'round-rectangle', Interface: 'round-rectangle', File: 'round-rectangle', Directory: 'round-rectangle' };
    const RELATION_COLORS = {
      PASSES_THROUGH: '#f2cc60', INVOKES: '#58a6ff', CALLS: '#4493f8', REFERENCES: '#6e7681',
      USES_TYPE: '#7ee787', IMPORTS: '#79c0ff', EXTENDS: '#ffa657', IMPLEMENTS: '#f778ba',
      TESTS: '#3fb950', DECLARES_BINDING: '#bc8cff', LOADS_SHADER: '#bc8cff', OVERRIDDEN_BY: '#f778ba',
      CONTAINS: '#30363d', DEFINES: '#30363d', default: '#30363d',
    };
    const TYPE_SIZES = {
      Repository: 34, Directory: 20, File: 18, Module: 16, Class: 22, Interface: 20,
      Function: 13, Method: 11, Route: 15, Entrypoint: 17, Test: 11, default: 9,
    };
    // group-box accent palette (cycled per group, stable by index)
    const GROUP_PALETTE = ['#1f6feb','#238636','#9e6a03','#8957e5','#bd561d','#1f8c8c','#a371f7','#3fb950','#db6d28','#6e7bff','#cf222e','#2da44e'];

    // ───────────────────────── view / state ─────────────────────────
    const is3DMode = window.location.pathname === '/3d';
    // Map = grouped compound boxes (the legible front door). Tree/Flow = dagre.
    // Force = ungrouped fcose. Shader = C++↔GLSL bridge subgraph.
    const VIEW_MODES = is3DMode
      ? [ ['map','◉','Map'], ['layers','▤','Layers'], ['force','✺','Force'], ['shader','▲','Shader'] ]
      : [ ['map','◉','Map'], ['tree','⊞','Tree'], ['flow','⇄','Flow'], ['force','✺','Force'], ['shader','▲','Shader'] ];
    let currentViewMode = 'map';
    let groupMode = 'dir';        // 'dir' | 'community'
    let groupDepth = 2;           // directory depth for dir grouping
    let sidebarCollapsed = false;
    const RENDER_NODE_CAP = 3000; // per-node views cap nodes above this so a heavy pick can't freeze the UI
    let lastRenderCap = { capped: 0, total: 0 };
    let navStack = [];            // node-detail visit history (back-stack)
    let navigatingBack = false;
    let degIn = null, degOut = null; // per-node in/out degree (hover tooltip), lazy
    function ensureDegMaps() {
      if (degIn) return;
      degIn = new Map(); degOut = new Map();
      for (const e of (allData.edges || [])) {
        const a = e.source ?? e.from_id, b = e.target ?? e.to_id;
        if (a) degOut.set(a, (degOut.get(a) || 0) + 1);
        if (b) degIn.set(b, (degIn.get(b) || 0) + 1);
      }
    }

    const activeTypes = new Set();
    const activeLayers = new Set(['code', 'feature', 'task', 'doc']);
    const activeEdgeClasses = new Set(['code', 'cross-layer']);
    const activeProvenance = new Set(['code', 'curated', 'inferred']);

    let cy = null, fg3d = null, ecApi = null;
    let allData = null;
    let archetypeMap = {}; // community_id → { name, id, confidence } (archetype naming)
    let currentFocusNodeId = null;
    let blastMode = false, blastResult = null;
    let pathChain = null;
    let drilledGroup = null;      // group key the Map is currently focused into
    const layerZ = { code: 0, feature: 700, task: 1100, doc: 1500 };

    // ───────────────────────── small helpers ─────────────────────────
    const $ = (id) => document.getElementById(id);
    function renderLocation(filePath, line) { return filePath ? `${filePath}${line ? `:${line}` : ''}` : 'external'; }
    function renderBadge(label, value, tone = 'default') {
      const colors = { default: '#8b949e', good: '#3fb950', warn: '#d29922', info: '#58a6ff' };
      return `<span class="tag"><span style="color:${colors[tone]};">●</span>${label}: ${value}</span>`;
    }
    function renderList(items, formatter, empty = 'none') {
      if (!items || !items.length) return `<div class="list-item">${empty}</div>`;
      return items.map(formatter).join('');
    }
    function toggleSet(set, key) { if (set.has(key)) set.delete(key); else set.add(key); }
    function setSidebarCollapsed(v) { sidebarCollapsed = Boolean(v); document.body.classList.toggle('sidebar-collapsed', sidebarCollapsed); setTimeout(() => cy && cy.resize(), 180); }
    function colorFor(node) {
      const arch = intelligenceColorFor(node);
      if (arch) return arch;
      if (node.layer && node.layer !== 'code') return LAYER_COLORS[node.layer];
      return TYPE_COLORS[node.kind || node.type] || '#6e7681';
    }
    const CALL_FAMILY = new Set(['CALLS', 'REFERENCES', 'INVOKES', 'USES_TYPE']);
    function isCallFamily(r) { return CALL_FAMILY.has(r); }
    function edgeColor(edge) {
      if ((edge.edge_class || 'code') === 'cross-layer') return edge.provenance === 'curated' ? '#58a6ff' : '#7ee787';
      if (isCallFamily(edge.relation) && edge.code_provenance === 'LSP_VERIFIED') return '#3fb950';
      return RELATION_COLORS[edge.relation] || RELATION_COLORS.default;
    }
    function loading(on, text) { const l = $('loading'); if (text) $('loading-text').textContent = text; l.style.display = on ? 'flex' : 'none'; }

    // ───────────────────────── grouping (the core of the rebuild) ─────────────
    // Derive a navigable group key + human title for a node. Directory grouping
    // gives titles a developer actually navigates by (engine/render, sim/fields,
    // mcp/stdio/query). Community grouping uses the precomputed leiden id.
    function normPath(p) { return (p || '').replace(/\\/g, '/'); }
    function dirGroupKey(node, depth) {
      const layer = node.layer || 'code';
      if (layer !== 'code') return `__${layer}`;
      // path-less symbols (library builtins, externals) cluster on their own
      if ((node.kind || node.type) === 'External') return '(external)';
      const p = normPath(node.file_path);
      if (!p) return '(external)';
      const parts = p.split('/').filter(s => s && s !== '.' && s !== '..');
      // group by DIRECTORY — drop the filename so a whole folder collapses into
      // one box (scripts/*.mjs → "scripts") instead of one box per file.
      if (parts.length > 1) parts.pop();
      const segs = parts.slice(0, Math.max(1, depth));
      return segs.join('/') || '(root)';
    }
    function communityGroupKey(node) {
      const layer = node.layer || 'code';
      if (layer !== 'code') return `__${layer}`;
      return node.community_id == null ? '(uncommunitied)' : `c${node.community_id}`;
    }
    // Archetype grouping MERGES all communities of the same purpose into one box
    // ("Physics", "Rendering", "Tests"…) — ~15 legible boxes instead of hundreds
    // of raw communities. The semantic front door.
    function archetypeGroupKey(node) {
      const layer = node.layer || 'code';
      if (layer !== 'code') return `__${layer}`;
      const a = node.community_id != null ? archetypeMap[node.community_id] : null;
      if (a && a.confidence !== 'low' && a.name && a.name !== 'Mixed') return `a:${a.name}`;
      return 'a:Mixed / other';
    }
    function groupKeyFor(node) {
      if (groupMode === 'community') return communityGroupKey(node);
      if (groupMode === 'archetype') return archetypeGroupKey(node);
      return dirGroupKey(node, groupDepth);
    }
    function groupTitle(key, members) {
      if (key === '__feature') return 'Features';
      if (key === '__task') return 'Tasks';
      if (key === '__doc') return 'Docs';
      if (key === '(external)') return 'External libs';
      if (key === '(root)') return '(root)';
      if (groupMode === 'archetype') {
        return key.startsWith('a:') ? key.slice(2) : key;
      }
      if (groupMode === 'community') {
        // Prefer the archetype name ("Physics", "Rendering") from the shared
        // classifier; fall back to the dominant directory of members.
        const cid = key.startsWith('c') ? key.slice(1) : key;
        const arch = archetypeMap[cid];
        const dirs = {};
        for (const m of members) { const d = dirGroupKey(m, 2); dirs[d] = (dirs[d] || 0) + 1; }
        const top = Object.entries(dirs).sort((a, b) => b[1] - a[1])[0];
        const dirLabel = top && top[0] !== '(root)' ? top[0] : null;
        if (arch && arch.confidence !== 'low' && arch.name && arch.name !== 'Mixed') {
          return dirLabel ? `${arch.name} · ${dirLabel}` : arch.name;
        }
        return dirLabel ? `${dirLabel} ·${key}` : `cluster ${key}`;
      }
      return key;
    }

    // ───────────────────────── detail panel (preserved) ─────────────────────────
    function trustSummary(node) {
      if (node.layer === 'feature') {
        const origin = node.origin || 'unknown';
        const confidence = origin === 'user' ? 0.95 : origin === 'skill' ? 0.7 : 0.55;
        return { score: confidence, badges: [renderBadge('origin', origin, origin === 'user' ? 'good' : 'warn'), renderBadge('layer', 'feature', 'info')] };
      }
      if (node.layer === 'task') {
        return { score: 0.82, badges: [renderBadge('origin', node.origin || 'tracker', 'info'), renderBadge('status', node.status || 'unknown', node.status === 'open' ? 'warn' : 'default')] };
      }
      const confidence = node.confidence == null ? 0.75 : Number(node.confidence);
      return { score: confidence, badges: [renderBadge('layer', node.layer || 'code', 'info'), renderBadge('confidence', confidence.toFixed(2), confidence > 0.8 ? 'good' : confidence > 0.55 ? 'warn' : 'default')] };
    }
    function renderSemanticDetailBlock(filePath) {
      if (!filePath) return '';
      const sem = intelligenceFileByPath.get(filePath);
      const arch = intelligenceLayerLabelFor(filePath);
      if (!sem && !arch) return '';
      const tagsHtml = sem?.tags?.length ? sem.tags.map(t => `<span class="tag-pill">${t}</span>`).join(' ') : '';
      const archHtml = arch ? `<div class="field"><span class="field-label">Layer:</span> ${arch.name} <span style="color:var(--faint);font-size:11px">(${arch.confidence}${arch.reason ? ' — ' + arch.reason : ''})</span></div>` : '';
      const semHtml = sem ? `
        <div class="field"><span class="field-label">Purpose:</span> ${sem.summary}</div>
        <div class="field"><span class="field-label">Kind:</span> ${sem.nodeType}${sem.entryPoint ? ' · entry-point' : ''}</div>
        <div class="field"><span class="field-label">Complexity:</span> ${sem.complexity}</div>
        ${tagsHtml ? `<div class="field"><span class="field-label">Tags:</span> ${tagsHtml}</div>` : ''}` : '';
      return `<div class="section-title">Intelligence</div><div class="detail-card">${semHtml}${archHtml}</div>`;
    }
    function renderRolePanel(node, codeDetail = null) {
      const detail = $('node-detail');
      const trust = trustSummary(node);
      const trustMeter = `<div class="trust-meter"><span class="field-label">Trust</span><div class="trust-bar"><div class="trust-bar-fill" style="width:${Math.round(trust.score * 100)}%"></div></div></div><div class="tag-list">${trust.badges.join('')}</div>`;
      if (node.layer === 'feature') {
        detail.innerHTML = `<h3>${node.label}</h3><div class="detail-card"><div class="field"><span class="field-label">Kind:</span> Feature</div><div class="field"><span class="field-label">Description:</span> ${node.description || '—'}</div>${trustMeter}</div>
          <div class="section-title">Depends on</div><div class="list">${renderList(node.depends_on, i => `<div class="list-item">${i}</div>`)}</div>
          <div class="section-title">Related to</div><div class="list">${renderList(node.related_to, i => `<div class="list-item">${i}</div>`)}</div>
          <div class="section-title">Anchors</div><div class="code-block">${JSON.stringify(node.anchors || {}, null, 2)}</div>`;
        return;
      }
      if (node.layer === 'task') {
        detail.innerHTML = `<h3>${node.label}</h3><div class="detail-card"><div class="field"><span class="field-label">Kind:</span> Task</div><div class="field"><span class="field-label">Status:</span> ${node.status || '—'}</div><div class="field"><span class="field-label">Assignee:</span> ${node.assignee || '—'}</div><div class="field"><span class="field-label">URL:</span> ${node.url ? `<a href="${node.url}" target="_blank" rel="noreferrer" style="color:var(--accent)">${node.url}</a>` : '—'}</div>${trustMeter}</div>
          <div class="section-title">Features</div><div class="list">${renderList(node.features, i => `<div class="list-item">${i}</div>`)}</div>`;
        return;
      }
      const n = codeDetail?.node || node;
      const semanticBlock = renderSemanticDetailBlock(n.file_path);
      const inc = codeDetail ? `<div class="section-title">Incoming (${codeDetail.incoming.length})</div><div class="list">${renderList(codeDetail.incoming, e => `<div class="edge-item" onclick="focusNode('code:${e.from_id}')">${tourEsc(e.relation)} ← ${tourEsc(e.from_label)} <span style="color:var(--faint)">[${tourEsc(e.from_type)}]</span></div>`)}</div>
          <div class="section-title">Outgoing (${codeDetail.outgoing.length})</div><div class="list">${renderList(codeDetail.outgoing, e => `<div class="edge-item" onclick="focusNode('code:${e.to_id}')">${tourEsc(e.relation)} → ${tourEsc(e.to_label)} <span style="color:var(--faint)">[${tourEsc(e.to_type)}]</span></div>`)}</div>` : '';
      const srcBtn = (n.file_path && n.start_line)
        ? `<button class="mini-button" id="src-load" data-path="${encodeURIComponent(n.file_path)}" data-from="${n.start_line}" data-to="${n.end_line || n.start_line}" style="margin-top:6px">📄 show source</button><div id="src-view"></div>`
        : '';
      detail.innerHTML = `<h3>${tourEsc(n.label)}</h3><div class="detail-card"><div class="field"><span class="field-label">Kind:</span> ${tourEsc(n.type || n.kind)}</div><div class="field"><span class="field-label">Path:</span> ${renderLocation(n.file_path, n.start_line)}</div><div class="field"><span class="field-label">Language:</span> ${tourEsc(n.language || '—')}</div>${trustMeter}</div>${semanticBlock}${inc}${srcBtn}`;
      const sb = detail.querySelector('#src-load');
      if (sb) sb.addEventListener('click', () => loadSource(sb));
    }
    // Inline source viewer (borrow: understand-anything CodeViewer) — fetches the
    // node's line range from /api/source (graph-gated) and shows it inline.
    async function loadSource(btn) {
      const view = document.getElementById('src-view');
      if (!view) return;
      view.innerHTML = '<div class="subtle">loading source…</div>';
      const p = decodeURIComponent(btn.dataset.path);
      const from = +btn.dataset.from, to = +btn.dataset.to;
      const data = await fetch(`/api/source?path=${encodeURIComponent(p)}&from=${from}&to=${to}`).then(r => r.json()).catch(() => null);
      if (!data || data.error || !Array.isArray(data.lines)) {
        view.innerHTML = `<div class="subtle">source unavailable${data && data.error ? ` (${data.error})` : ''}</div>`;
        return;
      }
      view.innerHTML = `<div class="src-box">${data.lines.map((ln, i) => `<div class="src-row"><span class="src-ln">${data.from + i}</span><code>${tourEsc(ln)}</code></div>`).join('')}</div>`;
    }
    async function renderIdleOverview(stats) {
      navStack = []; // back to overview → start a fresh exploration history
      const detail = $('node-detail');
      const [hotspotsResp, provResp] = await Promise.all([
        fetch('/api/hotspots?limit=10').then(r => r.json()).catch(() => ({ hotspots: [] })),
        fetch('/api/provenance').then(r => r.json()).catch(() => null),
      ]);
      const hotspots = hotspotsResp.hotspots || [];
      const types = (stats?.types || []).slice(0, 8);
      const maxType = Math.max(1, ...types.map(t => t.c));
      const provLine = provResp && provResp.total_call_edges ? `<div class="field"><span class="field-label">Call edges:</span> ${provResp.total_call_edges} · <span style="color:var(--good)">${provResp.lsp_verified_pct}% LSP-verified</span></div>` : '';
      const shaderLine = provResp?.shader?.bindings ? `<div class="field"><span class="field-label">Shader bindings:</span> ${provResp.shader.bindings}</div>` : '';
      detail.innerHTML = `<h3>Project overview</h3><div class="detail-card"><div class="field"><span class="field-label">Nodes:</span> ${stats?.nodeCount ?? '—'} · <span class="field-label">Edges:</span> ${stats?.edgeCount ?? '—'}</div>${provLine}${shaderLine}</div>
        <div class="section-title">Top hotspots (god nodes)</div><div class="list">${hotspots.length ? hotspots.map(h => `<div class="edge-item" data-hotspot="${encodeURIComponent(h.label)}" data-file="${encodeURIComponent(h.file_path || '')}">${h.label} <span style="color:var(--faint)">[${(h.type || '').toLowerCase()}] deg ${h.degree}</span></div>`).join('') : '<div class="list-item">none</div>'}</div>
        <div class="section-title">Node-type distribution</div><div class="list">${types.map(t => `<div class="field"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${t.type}</span><span>${t.c}</span></div><div style="height:6px;border-radius:3px;background:#21262d;overflow:hidden"><div style="height:100%;width:${Math.round((t.c / maxType) * 100)}%;background:var(--accent)"></div></div></div>`).join('')}</div>`;
      detail.querySelectorAll('[data-hotspot]').forEach(el => el.addEventListener('click', () => {
        const label = decodeURIComponent(el.dataset.hotspot);
        const filePath = decodeURIComponent(el.dataset.file || '');
        const cand = allData.nodes.find(n => n.label === label && (!filePath || n.file_path === filePath)) || allData.nodes.find(n => n.label === label);
        if (cand) focusNode(cand.id);
      }));
    }
    async function showNodeDetail(nodeId) {
      const node = allData.nodes.find(n => n.id === nodeId);
      if (!node) return;
      // Navigation history (borrow: understand-anything node back-stack) — push
      // each visited node so a click-through exploration can be retraced.
      if (!navigatingBack && navStack[navStack.length - 1] !== nodeId) {
        navStack.push(nodeId);
        if (navStack.length > 40) navStack.shift();
      }
      navigatingBack = false;
      if (node.layer && node.layer !== 'code' && node.kind !== 'Document') { renderRolePanel(node); prependNavBack(); return; }
      const codeId = nodeId.startsWith('code:') ? nodeId.slice('code:'.length) : nodeId;
      const data = await fetch(`/api/node/${encodeURIComponent(codeId)}`).then(r => r.json()).catch(() => null);
      if (!data?.node) { renderRolePanel(node); prependNavBack(); return; }
      renderRolePanel(node, data);
      prependNavBack();
    }
    // Prepend a "← back to <prev>" control to the detail panel when there's history.
    function prependNavBack() {
      if (navStack.length < 2) return;
      const detail = $('node-detail');
      const prev = allData.nodes.find(n => n.id === navStack[navStack.length - 2]);
      const bar = document.createElement('div');
      bar.className = 'nav-back-bar';
      bar.innerHTML = `<button class="nav-back-btn" type="button">← back${prev ? ` to ${tourEsc(prev.label)}` : ''}</button>`;
      bar.querySelector('.nav-back-btn').onclick = () => {
        navStack.pop();
        navigatingBack = true;
        window.focusNode(navStack[navStack.length - 1]);
      };
      detail.insertBefore(bar, detail.firstChild);
    }

    // ───────────────────────── stats + controls ─────────────────────────
    function renderStats(graphData, stats) {
      const prov = window.__provenance;
      const provStat = prov && prov.total_call_edges ? `<div class="stat"><span>Call edges LSP-verified</span><span class="stat-value" style="color:var(--good)">${prov.lsp_verified_pct}%</span></div>` : '';
      const meta = graphData.meta || {};
      const trunc = (meta.truncated_nodes || meta.truncated_edges) ? `<div class="subtle">Showing ${graphData.nodes.length.toLocaleString()} / ${(meta.total_code_nodes || meta.total_nodes || graphData.nodes.length).toLocaleString()} nodes.</div>` : '';
      $('stats').innerHTML = `
        <div class="stat"><span>Nodes</span><span class="stat-value">${stats.nodeCount}</span></div>
        <div class="stat"><span>Edges</span><span class="stat-value">${stats.edgeCount}</span></div>
        ${provStat}${trunc}`;
    }

    function buildControls(graphData) {
      const el = $('controls');
      const isMultilayer = graphData.nodes.length > 0 && 'layer' in graphData.nodes[0];
      const types = [...new Set(graphData.nodes.map(n => n.kind || n.type))].filter(Boolean).sort();
      types.forEach(t => activeTypes.add(t));
      const layers = ['code', 'feature', 'task', 'doc'];
      const layerCounts = Object.fromEntries(layers.map(l => [l, graphData.nodes.filter(n => n.layer === l).length]));

      let html = `<div class="section-title" style="margin-top:8px">View</div><div class="pill-row">`;
      html += VIEW_MODES.map(([mode, ic, label]) => `<button class="toggle-pill view-pill ${currentViewMode === mode ? 'active' : ''}" type="button" data-view="${mode}"><span class="ic">${ic}</span>${label}</button>`).join('');
      html += `</div>`;

      // grouping controls (only meaningful for Map)
      html += `<div class="ctl-group" id="group-ctls"><div class="section-title">Grouping</div><div class="pill-row">
          <button class="toggle-pill ${groupMode === 'dir' ? 'active' : ''}" data-group="dir" type="button">by directory</button>
          <button class="toggle-pill ${groupMode === 'archetype' ? 'active' : ''}" data-group="archetype" type="button">by archetype</button>
          <button class="toggle-pill ${groupMode === 'community' ? 'active' : ''}" data-group="community" type="button">by community</button>
        </div>
        <div class="slider-row" id="depth-row"><span>depth</span><input type="range" id="group-depth" min="1" max="4" step="1" value="${groupDepth}"><span id="depth-val">${groupDepth}</span></div>
        <div class="subtle">Map shows labeled <b>group boxes</b>. Double-click a box (or ⊕) to expand it; double-click a node to focus its group.</div></div>`;

      // legend-ish filters
      html += `<details class="fold"><summary>Filters</summary><div class="fold-body">`;
      if (isMultilayer) {
        html += `<div class="section-title" style="margin-top:2px">Layers</div><div class="pill-row">` +
          layers.filter(l => layerCounts[l] > 0).map(l => `<button class="toggle-pill active" data-layer="${l}" type="button"><span style="color:${LAYER_COLORS[l]}">●</span> ${l} (${layerCounts[l]})</button>`).join('') + `</div>`;
        html += `<div class="section-title">Edge classes</div><div class="pill-row">
            <button class="toggle-pill active" data-edge-class="code" type="button">code</button>
            <button class="toggle-pill active" data-edge-class="cross-layer" type="button">cross-layer</button></div>`;
      }
      html += `<div class="section-title">Node types</div><div class="pill-row">` +
        types.map(t => `<button class="toggle-pill active" data-type="${t}" type="button">${t} (${graphData.nodes.filter(n => (n.kind || n.type) === t).length})</button>`).join('') + `</div></div></details>`;

      // analysis tools
      // Blast radius + Pathfinder paint only into the 2D cytoscape canvas
      // (paintBlast/paintPath early-return without `cy`), so hide them in 3D —
      // their controls would do nothing there. Focus/Neighborhood work in both.
      const twoDOnlyTools = is3DMode ? '' : `
        <div class="section-title">Blast radius</div>
        <div class="pill-row"><button class="toggle-pill ${blastMode ? 'active' : ''}" id="blast-toggle" type="button">blast mode${blastMode ? ' ✓' : ''}</button><button class="mini-button" id="blast-clear" type="button">clear</button></div>
        <div class="subtle">Toggle on, click a node — changed=red, affected=amber.</div>
        <div class="section-title">Pathfinder</div>
        <div class="pill-row" style="gap:4px"><input id="path-from" class="mini-input" placeholder="from" style="flex:1;min-width:80px"><input id="path-to" class="mini-input" placeholder="to" style="flex:1;min-width:80px"><button class="mini-button" id="path-go" type="button">find</button></div>
        <div class="subtle" id="path-status"></div>`;
      html += `<details class="fold"><summary>Analysis tools</summary><div class="fold-body">
        <div class="section-title" style="margin-top:2px">Focus</div>
        <div class="btn-row"><button class="mini-button" id="focus-neighborhood" type="button">Neighborhood</button><button class="mini-button" id="clear-focus" type="button">Clear</button></div>
        ${twoDOnlyTools}</div></details>`;

      el.innerHTML = html;

      el.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { setView(b.dataset.view); }));
      el.querySelectorAll('[data-group]').forEach(b => b.addEventListener('click', () => {
        groupMode = b.dataset.group;
        drilledGroup = null; // key space changed — a drilled key from the old mode won't match (would empty the graph)
        el.querySelectorAll('[data-group]').forEach(o => o.classList.toggle('active', o.dataset.group === groupMode));
        $('depth-row').style.display = groupMode === 'dir' ? 'flex' : 'none';
        if (currentViewMode === 'map' || currentViewMode === 'force') renderGraph(false);
      }));
      const depthEl = $('group-depth');
      if (depthEl) depthEl.addEventListener('input', (e) => { groupDepth = +e.target.value; $('depth-val').textContent = groupDepth; });
      if (depthEl) depthEl.addEventListener('change', () => { if (groupMode === 'dir' && currentViewMode === 'map') { drilledGroup = null; renderGraph(false); } });
      el.querySelectorAll('[data-layer]').forEach(b => b.addEventListener('click', () => { toggleSet(activeLayers, b.dataset.layer); b.classList.toggle('active', activeLayers.has(b.dataset.layer)); renderGraph(false); }));
      el.querySelectorAll('[data-edge-class]').forEach(b => b.addEventListener('click', () => { toggleSet(activeEdgeClasses, b.dataset.edgeClass); b.classList.toggle('active', activeEdgeClasses.has(b.dataset.edgeClass)); renderGraph(false); }));
      el.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => { toggleSet(activeTypes, b.dataset.type); b.classList.toggle('active', activeTypes.has(b.dataset.type)); renderGraph(false); }));
      $('focus-neighborhood').addEventListener('click', () => { if (currentFocusNodeId) applyNeighborhoodMode(currentFocusNodeId); });
      $('clear-focus').addEventListener('click', () => { clearNeighborhoodMode(); renderIdleOverview(window.__lastStats); });
      // Blast/Pathfinder controls exist only in 2D (cytoscape) — guard the wiring.
      $('blast-toggle')?.addEventListener('click', (e) => { blastMode = !blastMode; e.target.classList.toggle('active', blastMode); e.target.textContent = `blast mode${blastMode ? ' ✓' : ''}`; });
      $('blast-clear')?.addEventListener('click', clearBlast);
      $('path-go')?.addEventListener('click', () => runPathfinder($('path-from').value.trim(), $('path-to').value.trim()));
      syncGroupCtlVisibility();
    }
    function syncGroupCtlVisibility() {
      const g = $('group-ctls'); if (!g) return;
      g.style.display = (currentViewMode === 'map' || currentViewMode === 'force') ? 'block' : 'none';
      const dr = $('depth-row'); if (dr) dr.style.display = groupMode === 'dir' ? 'flex' : 'none';
    }
    function setView(mode) {
      currentViewMode = mode;
      drilledGroup = null;
      document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
      syncGroupCtlVisibility();
      renderGraph(true);
    }

    // ───────────────────────── element building ─────────────────────────
    function shaderViewIds() {
      const ids = new Set();
      for (const n of allData.nodes) if ((n.kind || n.type) === 'ShaderBinding') ids.add(n.id);
      const rel = new Set(['DECLARES_BINDING', 'LOADS_SHADER', 'OVERRIDDEN_BY']);
      for (const e of allData.edges) {
        if (!rel.has(e.relation)) continue;
        const src = e.source ?? `code:${e.from_id}`, tgt = e.target ?? `code:${e.to_id}`;
        if (ids.has(src) || ids.has(tgt)) { ids.add(src); ids.add(tgt); }
      }
      return ids;
    }
    // Filter the loaded graph down to the currently-visible node + edge set.
    function visibleGraph() {
      const isMultilayer = allData.nodes.length > 0 && 'layer' in allData.nodes[0];
      let nodes = isMultilayer
        ? allData.nodes.filter(n => activeLayers.has(n.layer) && (n.layer !== 'code' || activeTypes.has(n.kind || n.type)))
        : allData.nodes.filter(n => activeTypes.has(n.type));
      if (currentViewMode === 'shader') { const s = shaderViewIds(); nodes = nodes.filter(n => s.has(n.id)); }
      if (drilledGroup) nodes = nodes.filter(n => groupKeyFor(n) === drilledGroup);
      let nodeIds = new Set(nodes.map(n => n.id));
      let edges = isMultilayer
        ? allData.edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target) && activeEdgeClasses.has(e.edge_class || 'code') && activeProvenance.has(e.provenance || 'code'))
        : allData.edges.filter(e => nodeIds.has(e.from_id) && nodeIds.has(e.to_id));

      // HEAVY-RENDER GUARD: the per-node views (raw Force/Shader/Tree/Flow, or a
      // drilled Map group) lay out every node synchronously — on a big graph that
      // freezes the main thread so the controls stop responding. Cap to the
      // highest-degree nodes so a heavy pick can't lock the UI. The grouped Map
      // overview (boxes) is light and exempt.
      // 3D always renders individual node meshes (no lightweight group-box view
      // like the 2D Map), so EVERY 3D view is per-node and must be capped — that
      // was the main 3D-lag source (the default 3D 'map' rendered every node). In
      // 2D only the raw/drilled views are per-node; the grouped Map is exempt.
      const perNode = is3DMode || !!drilledGroup || ['force', 'shader', 'tree', 'flow'].includes(currentViewMode);
      const total = nodes.length;
      let capped = 0;
      if (perNode && total > RENDER_NODE_CAP) {
        const deg = new Map();
        for (const e of edges) { const a = e.source ?? e.from_id, b = e.target ?? e.to_id; deg.set(a, (deg.get(a) || 0) + 1); deg.set(b, (deg.get(b) || 0) + 1); }
        nodes = [...nodes].sort((x, y) => (deg.get(y.id) || 0) - (deg.get(x.id) || 0)).slice(0, RENDER_NODE_CAP);
        capped = total - nodes.length;
        nodeIds = new Set(nodes.map(n => n.id));
        edges = edges.filter(e => nodeIds.has(e.source ?? e.from_id) && nodeIds.has(e.target ?? e.to_id));
      }
      lastRenderCap = { capped, total };
      return { nodes, edges, isMultilayer, capped, total };
    }
    function nodeDataEl(n) {
      return { group: 'nodes', data: {
        id: n.id, label: n.label, layer: n.layer, kind: n.kind || n.type, type: n.kind || n.type,
        file_path: n.file_path, start_line: n.start_line, description: n.description, status: n.status,
        origin: n.origin, depends_on: n.depends_on, related_to: n.related_to, features: n.features,
        tags: n.tags, anchors: n.anchors, assignee: n.assignee, url: n.url, confidence: n.confidence,
        language: n.language, community_id: n.community_id, color: colorFor(n),
      } };
    }
    function edgeDataEl(e, isMultilayer, i) {
      return isMultilayer
        ? { group: 'edges', data: { id: e.id || `e${i}`, source: e.source, target: e.target, relation: e.relation, edge_class: e.edge_class, provenance: e.provenance, code_provenance: e.code_provenance, confidence: e.confidence } }
        : { group: 'edges', data: { id: `e${i}`, source: e.from_id, target: e.to_id, relation: e.relation, confidence: e.confidence } };
    }
    // Build the Map OVERVIEW: standalone labeled group-box nodes (~dozens) +
    // aggregated inter-group edges. Computed entirely client-side from the
    // already-loaded graph — never ships the 3k raw nodes, so it stays instant.
    // Double-clicking a box drills into that one group's members.
    function buildGroupBoxElements() {
      const { nodes, edges } = visibleGraph();
      const groups = new Map();           // key -> { members(sample), count }
      const nodeGroup = new Map();        // node id -> group key
      for (const n of nodes) {
        const k = groupKeyFor(n);
        nodeGroup.set(n.id, k);
        if (!groups.has(k)) groups.set(k, { members: [], count: 0 });
        const g = groups.get(k); g.count++; if (g.members.length < 8) g.members.push(n);
      }
      const keys = [...groups.keys()].sort();
      const pal = new Map(keys.map((k, i) => [k, GROUP_PALETTE[i % GROUP_PALETTE.length]]));
      const maxC = Math.max(1, ...keys.map(k => groups.get(k).count));
      // aggregate cross-group edges → one weighted edge per ordered group pair.
      // NOTE: the map key joins the two group keys with a U+0001 (SOH) control
      // char — a separator that can never appear in a dir/community/archetype key
      // (those contain '/', ':', '.', spaces). split() on the same char recovers
      // the endpoints. It renders invisibly in editors — it is NOT an empty-string
      // join; the byte is intentional.
      const agg = new Map();
      for (const e of edges) {
        const s = e.source ?? `code:${e.from_id}`, t = e.target ?? `code:${e.to_id}`;
        const gs = nodeGroup.get(s), gt = nodeGroup.get(t);
        if (gs == null || gt == null || gs === gt) continue;
        const key = gs + '' + gt;
        agg.set(key, (agg.get(key) || 0) + 1);
      }
      const els = keys.map(k => {
        const g = groups.get(k);
        const sz = 46 + 130 * Math.sqrt(g.count / maxC);
        return { group: 'nodes', data: { id: `grp:${k}`, label: `${groupTitle(k, g.members)}\n${g.count}`, isGroup: true, groupKey: k, accent: pal.get(k), size: sz } };
      });
      for (const [key, count] of agg) {
        const [a, b] = key.split('');
        els.push({ group: 'edges', data: { id: `agg:${a}>${b}`, source: `grp:${a}`, target: `grp:${b}`, aggCount: count, width: Math.min(10, 1 + Math.log(1 + count) * 1.5) } });
      }
      return { els, groupCount: keys.length, nodeCount: nodes.length };
    }
    function buildFlatElements() {
      const { nodes, edges, isMultilayer } = visibleGraph();
      const els = nodes.map(nodeDataEl);
      edges.forEach((e, i) => els.push(edgeDataEl(e, isMultilayer, i)));
      return { els, nodeCount: nodes.length };
    }

    // ───────────────────────── cytoscape style ─────────────────────────
    function baseStylesheet(nodeCount) {
      const labelFont = nodeCount > 1400 ? 0 : 9;
      return [
        { selector: 'node[!isGroup]', style: {
          label: 'data(label)', 'font-size': labelFont, 'min-zoomed-font-size': 9, color: '#c9d1d9',
          'text-outline-color': '#0d1117', 'text-outline-width': 1.6, 'text-valign': 'bottom', 'text-margin-y': 2,
          'background-color': 'data(color)',
          'shape': (ele) => KIND_SHAPES[ele.data('kind')] || LAYER_SHAPES[ele.data('layer')] || 'ellipse',
          width: (ele) => { const l = ele.data('layer'); if (l === 'feature') return 24; if (l === 'task') return 18; if (l === 'doc') return 15; return TYPE_SIZES[ele.data('kind')] || TYPE_SIZES.default; },
          height: (ele) => { const l = ele.data('layer'); if (l === 'feature') return 18; if (l === 'task') return 18; if (l === 'doc') return 15; return TYPE_SIZES[ele.data('kind')] || TYPE_SIZES.default; },
          'border-width': 0,
        } },
        { selector: 'node[?isGroup]', style: {
          label: 'data(label)', 'text-wrap': 'wrap', 'text-max-width': '150px', 'font-size': 13, 'font-weight': 'bold', color: '#e6edf3',
          'text-valign': 'center', 'text-halign': 'center', 'min-zoomed-font-size': 5,
          'background-color': 'data(accent)', 'background-opacity': 0.42,
          'border-width': 1.6, 'border-color': 'data(accent)', 'border-opacity': 0.95,
          shape: 'round-rectangle', width: 'data(size)', height: (ele) => Math.max(40, ele.data('size') * 0.6),
          'text-outline-color': '#0d1117', 'text-outline-width': 2.5,
        } },
        { selector: 'node[?isGroup]:active, node[?isGroup].hovergrp', style: { 'background-opacity': 0.62, 'border-width': 2.4 } },
        { selector: 'edge', style: {
          width: (ele) => ele.data('relation') === 'PASSES_THROUGH' ? 2 : 1.1,
          'line-color': (ele) => edgeColor(ele.data()),
          'line-style': (ele) => { if ((ele.data('edge_class') || 'code') === 'cross-layer') return ele.data('provenance') === 'curated' ? 'dashed' : 'dotted'; if (isCallFamily(ele.data('relation'))) return ele.data('code_provenance') === 'LSP_VERIFIED' ? 'solid' : 'dashed'; return 'solid'; },
          'target-arrow-color': (ele) => edgeColor(ele.data()), 'target-arrow-shape': 'triangle', 'arrow-scale': 0.7,
          'curve-style': 'bezier',
          opacity: (ele) => { const c = ele.data('confidence'); const base = (ele.data('edge_class') || 'code') === 'cross-layer' ? 0.5 : 0.42; if (c == null) return base; return Math.max(0.16, Math.min(1, base * (0.45 + c))); },
        } },
        { selector: 'edge[aggCount]', style: { 'line-color': '#586069', 'target-arrow-color': '#586069', width: 'data(width)', opacity: 0.45, 'line-style': 'solid', 'curve-style': 'bezier', 'arrow-scale': 0.8 } },
        { selector: 'node:selected', style: { 'border-width': 3, 'border-color': '#f0883e' } },
        { selector: 'edge:selected', style: { 'line-color': '#f0883e', 'target-arrow-color': '#f0883e', width: 2, opacity: 1 } },
        { selector: '.dimmed', style: { opacity: 0.12 } },
        { selector: '.highlighted', style: { 'border-width': 3, 'border-color': '#58a6ff', 'z-index': 30 } },
        { selector: '.blast-changed', style: { 'background-color': '#da3633', 'border-width': 3, 'border-color': '#ff7b72', 'z-index': 20 } },
        { selector: '.blast-affected', style: { 'background-color': '#d29922', 'z-index': 15 } },
        { selector: '.blast-faded', style: { opacity: 0.07 } },
        { selector: '.path-node', style: { 'background-color': '#a371f7', 'border-width': 3, 'border-color': '#d2a8ff', 'z-index': 25 } },
        { selector: '.path-edge', style: { 'line-color': '#a371f7', 'target-arrow-color': '#a371f7', width: 3, opacity: 1, 'z-index': 25 } },
      ];
    }

    // ───────────────────────── layout configs ─────────────────────────
    function fcoseConfig(grouped, nodeCount) {
      // fcose runs SYNCHRONOUSLY (animate:false); on big raw sets a high iteration
      // count blocks the main thread long enough that the browser kills the tab
      // ("page crashed" on the 2D Force view). Scale quality + iterations DOWN as
      // the set grows so it always finishes fast (the node cap already bounds it).
      const big = nodeCount > 2000, mid = nodeCount > 1200;
      return {
        name: 'fcose', quality: big ? 'draft' : (mid ? 'default' : 'proof'), animate: false, randomize: true,
        nodeDimensionsIncludeLabels: true, packComponents: true, tile: true,
        nodeRepulsion: grouped ? 7000 : 5000,
        idealEdgeLength: (edge) => (edge.data('edge_class') === 'cross-layer' ? 160 : 55),
        edgeElasticity: 0.45, nestingFactor: 0.12, gravity: 0.28, gravityRangeCompound: 1.4,
        gravityCompound: 1.0, gravityRange: 3.8, numIter: big ? 350 : (mid ? 1000 : 2500),
        nodeSeparation: grouped ? 90 : 60, padding: 30,
      };
    }
    function dagreConfig(rankDir) {
      return { name: 'dagre', rankDir: rankDir || 'TB', nodeSep: 28, edgeSep: 12, rankSep: 70, animate: false, fit: true, padding: 30 };
    }

    // ───────────────────────── 2D render ─────────────────────────
    function destroyCy() { if (ecApi) { try { ecApi = null; } catch (e) {} } if (cy) { cy.destroy(); cy = null; } }
    function showBanner(text) { let b = $('cy-banner'); if (!text) { if (b) b.remove(); return; } if (!b) { b = document.createElement('div'); b.id = 'cy-banner'; b.className = 'banner'; $('graph-container').appendChild(b); } b.textContent = text; }

    function render2D() {
      $('fg3d').style.display = 'none';
      $('cy').style.display = 'block';
      destroyCy();
      showBanner('');
      // "Boxes vs members" depends on DRILL state, not the view. Map/Tree/Flow
      // all show the labeled directory BOXES at the top level (instant — a few
      // dozen nodes) and the group's raw member nodes once drilled in. Force and
      // Shader always work on raw nodes. This keeps every view fast: we never
      // hand dagre/fcose the full 3k-node graph at the top level.
      const rawView = currentViewMode === 'force' || currentViewMode === 'shader';
      const useBoxes = !drilledGroup && !rawView;
      const built = useBoxes ? buildGroupBoxElements() : buildFlatElements();
      const nodeCount = built.nodeCount;
      const boxCount = built.groupCount || 0;

      let layout;
      if (currentViewMode === 'tree') layout = dagreConfig('TB');
      else if (currentViewMode === 'flow') layout = dagreConfig('LR');
      else if (useBoxes) {
        // Map overview: fcose on a few dozen boxes — strong repulsion → clean spread
        layout = { name: 'fcose', quality: 'proof', animate: false, randomize: true,
          nodeDimensionsIncludeLabels: true, packComponents: true, tile: true,
          nodeRepulsion: 26000, idealEdgeLength: 210, edgeElasticity: 0.25,
          gravity: 0.12, gravityRange: 4.5, numIter: 2500, nodeSeparation: 230, padding: 50 };
      } else {
        // Force / drilled-Map: fcose on the member set (drop quality on big sets)
        layout = fcoseConfig(false, nodeCount);
      }

      if (rawView && nodeCount > 2400 && !drilledGroup) {
        showBanner(`Force layout on ${nodeCount.toLocaleString()} nodes — this can take a few seconds. Tip: drill into a Map box first for a snappier view.`);
      }

      cy = cytoscape({
        container: $('cy'), elements: built.els, style: baseStylesheet(useBoxes ? boxCount : nodeCount),
        layout, pixelRatio: 1, textureOnViewport: nodeCount > 1500, motionBlur: false, hideEdgesOnViewport: nodeCount > 1800,
      });
      requestAnimationFrame(() => cy.fit(undefined, useBoxes ? 55 : 40));

      cy.on('tap', 'node', (e) => {
        const n = e.target;
        if (n.data('isGroup')) { drillInto(n.data('groupKey')); return; }
        currentFocusNodeId = n.id();
        if (blastMode) { runBlastRadius(currentFocusNodeId); return; }
        showNodeDetail(currentFocusNodeId);
        applyNeighborhoodMode(currentFocusNodeId);
      });
      cy.on('mouseover', 'node[?isGroup]', (e) => e.target.addClass('hovergrp'));
      cy.on('mouseout', 'node[?isGroup]', (e) => e.target.removeClass('hovergrp'));
      // Hover tooltip with degree (borrow: understand-anything NodeTooltip) — gauge
      // a node's importance/role without clicking.
      cy.on('mouseover', 'node[!isGroup]', (e) => {
        ensureDegMaps();
        const n = e.target, id = n.id();
        const ind = degIn.get(id) || 0, outd = degOut.get(id) || 0;
        const tip = $('node-tip');
        tip.innerHTML = `<b>${tourEsc(n.data('label'))}</b> <span style="color:var(--faint)">[${tourEsc(n.data('kind') || n.data('type') || '')}]</span><br>${ind} in · ${outd} out · ${ind + outd} total`;
        const rp = e.renderedPosition || { x: 0, y: 0 };
        tip.style.left = (rp.x + 14) + 'px'; tip.style.top = (rp.y + 10) + 'px';
        tip.style.display = 'block';
      });
      cy.on('mouseout', 'node[!isGroup]', () => { const t = $('node-tip'); if (t) t.style.display = 'none'; });

      if (blastResult) paintBlast();
      if (pathChain) paintPath();
      updateCtxBar();
    }

    function drillInto(groupKey) { drilledGroup = groupKey; currentViewMode = 'map'; document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'map')); syncGroupCtlVisibility(); renderGraph(true); }
    function updateCtxBar() {
      const bar = $('ctxbar');
      if (!drilledGroup) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      bar.innerHTML = `<span class="crumb"><span class="crumb-btn" id="crumb-home">Map</span> ▸ <b>${drilledGroup}</b></span><span class="x" id="crumb-x">✕ back to map</span>`;
      $('crumb-home').addEventListener('click', () => { drilledGroup = null; setView('map'); });
      $('crumb-x').addEventListener('click', () => { drilledGroup = null; setView('map'); });
    }

    // ───────────────────────── 3D render (grouped clustering force) ─────────────
    function render3D() {
      $('cy').style.display = 'none';
      const container = $('fg3d');
      container.style.display = 'block';
      container.innerHTML = '';
      const { nodes, edges, isMultilayer } = visibleGraph();
      const groupKeys = [...new Set(nodes.map(groupKeyFor))].sort();
      const palIdx = new Map(groupKeys.map((k, i) => [k, GROUP_PALETTE[i % GROUP_PALETTE.length]]));
      // group centroids on a circle (spread groups apart spatially)
      const R = Math.max(500, groupKeys.length * 90);
      const centroids = new Map(groupKeys.map((k, i) => {
        const a = (i / Math.max(1, groupKeys.length)) * Math.PI * 2;
        return [k, { x: Math.cos(a) * R, y: Math.sin(a) * R * 0.7, z: layerZ[k.startsWith('__') ? k.slice(2) : 'code'] ?? 0 }];
      }));
      const useCluster = currentViewMode === 'map' || currentViewMode === 'force';
      const nodeObjs = nodes.map(n => {
        const gk = groupKeyFor(n);
        const c = centroids.get(gk);
        return { ...nodeDataEl(n).data, __group: gk, __gc: c, __color: (groupMode === 'community' || groupMode === 'archetype') && useCluster ? palIdx.get(gk) : colorFor(n),
          x: c ? c.x + (Math.random() - 0.5) * 120 : 0, y: c ? c.y + (Math.random() - 0.5) * 120 : 0, z: (c ? c.z : 0) + (Math.random() - 0.5) * 80 };
      });
      const links = edges.map((e, i) => isMultilayer ? { source: e.source, target: e.target, relation: e.relation, edge_class: e.edge_class, provenance: e.provenance, code_provenance: e.code_provenance } : { source: e.from_id, target: e.to_id, relation: e.relation });

      fg3d = ForceGraph3D()(container)
        .backgroundColor('#0d1117')
        .graphData({ nodes: nodeObjs, links })
        .nodeLabel(n => { ensureDegMaps(); const i = degIn.get(n.id) || 0, o = degOut.get(n.id) || 0; return `${n.label}\n${n.__group}\n${i} in · ${o} out · ${i + o} total`; })
        .nodeColor(n => n.__color)
        .nodeRelSize(4)
        // Perf: lower sphere segment count (8→5) — far fewer triangles per node,
        // visually ~identical at this scale; big win on thousands of nodes (3D lag).
        .nodeResolution(5)
        .nodeVal(n => n.layer === 'feature' ? 9 : n.layer === 'task' ? 6 : n.layer === 'doc' ? 5 : 2.6)
        .linkColor(l => edgeColor(l))
        .linkWidth(l => (l.edge_class || 'code') === 'cross-layer' ? 1.3 : 0.6)
        .linkOpacity(0.18)
        .linkResolution(3)
        .linkCurvature(0).linkDirectionalParticles(0)
        // Perf: stop the physics sim sooner on big graphs (each tick is O(n) +
        // the clustering force) — fewer ticks = the layout settles faster and the
        // main thread frees up. Layers view doesn't simulate.
        .cooldownTicks(currentViewMode === 'layers' ? 0 : (nodes.length > 1500 ? 60 : 120))
        .enableNodeDrag(nodes.length < 2500)
        .onNodeClick(n => { currentFocusNodeId = n.id; showNodeDetail(n.id); applyNeighborhoodMode(n.id); fg3d.cameraPosition({ x: n.x, y: n.y, z: (n.z || 0) + 200 }, n, 700); });

      fg3d.d3Force('charge').strength(currentViewMode === 'force' ? -60 : -22);
      fg3d.d3Force('link').distance(l => (l.edge_class || 'code') === 'cross-layer' ? 180 : 34);
      // custom clustering force: pull each node toward its group centroid so
      // groups separate into legible spatial clusters (UA-style spacing in 3D).
      if (useCluster) {
        const STR = 0.06;
        fg3d.d3Force('cluster', (alpha) => {
          for (const n of nodeObjs) { if (!n.__gc) continue; const k = STR * alpha; n.vx += (n.__gc.x - n.x) * k; n.vy += (n.__gc.y - n.y) * k; n.vz += ((n.__gc.z) - n.z) * k; }
        });
      }
      if (currentViewMode === 'layers') {
        // pin Z by layer plane → distinct stacked planes
        nodeObjs.forEach(n => { n.fz = layerZ[n.layer] ?? 0; });
      }
      requestAnimationFrame(() => { if (fg3d?.zoomToFit) fg3d.zoomToFit(900, 90); });
    }

    // ───────────────────────── focus / neighborhood ─────────────────────────
    function neighborIdsFor(nodeId) { const ids = new Set([nodeId]); for (const e of allData.edges) { const s = e.source ?? `code:${e.from_id}`, t = e.target ?? `code:${e.to_id}`; if (s === nodeId) ids.add(t); if (t === nodeId) ids.add(s); } return ids; }
    function applyNeighborhoodMode(nodeId) {
      currentFocusNodeId = nodeId;
      const ids = neighborIdsFor(nodeId);
      if (cy) { cy.elements().addClass('dimmed').removeClass('highlighted'); const node = cy.getElementById(nodeId); if (node.length) { node.removeClass('dimmed').addClass('highlighted'); node.closedNeighborhood().removeClass('dimmed'); } }
      if (fg3d) { fg3d.nodeColor(n => ids.has(n.id) ? n.__color : 'rgba(110,110,110,0.1)'); fg3d.linkColor(l => { const s = typeof l.source === 'string' ? l.source : l.source.id, t = typeof l.target === 'string' ? l.target : l.target.id; return ids.has(s) && ids.has(t) ? edgeColor(l) : 'rgba(110,110,110,0.06)'; }); }
    }
    function clearNeighborhoodMode() { currentFocusNodeId = null; if (cy) cy.elements().removeClass('dimmed highlighted'); if (fg3d) { fg3d.nodeColor(n => n.__color); fg3d.linkColor(l => edgeColor(l)); } }

    // ───────────────────────── blast radius ─────────────────────────
    async function runBlastRadius(dashboardId) {
      const rawId = dashboardId.startsWith('code:') ? dashboardId.slice('code:'.length) : dashboardId;
      const res = await fetch(`/api/impact/${encodeURIComponent(rawId)}?depth=4`).then(r => r.json()).catch(() => null);
      if (!res) return;
      const toDash = (id) => `code:${id}`;
      blastResult = { changed: new Set((res.changed || []).map(toDash)), affected: new Set((res.affected || []).map(toDash)) };
      showNodeDetail(dashboardId); paintBlast();
    }
    function paintBlast() { if (!cy || !blastResult) return; cy.batch(() => cy.nodes('[!isGroup]').forEach(n => { n.removeClass('blast-changed blast-affected blast-faded'); const id = n.id(); if (blastResult.changed.has(id)) n.addClass('blast-changed'); else if (blastResult.affected.has(id)) n.addClass('blast-affected'); else n.addClass('blast-faded'); })); }
    function clearBlast() { blastResult = null; if (cy) cy.nodes().removeClass('blast-changed blast-affected blast-faded'); }

    // ───────────────────────── pathfinder ─────────────────────────
    async function runPathfinder(fromQuery, toQuery) {
      const resolveId = async (q) => { if (!q) return null; const hits = await fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []); return (hits && hits.length) ? hits[0].id : q; };
      const fromId = await resolveId(fromQuery), toId = await resolveId(toQuery);
      const status = $('path-status');
      if (!fromId || !toId) { if (status) status.textContent = 'Enter both endpoints.'; return; }
      const res = await fetch(`/api/path?from=${encodeURIComponent(fromId)}&to=${encodeURIComponent(toId)}`).then(r => r.json()).catch(() => null);
      if (!res || !res.found) { pathChain = null; if (cy) cy.elements().removeClass('path-node path-edge'); if (status) status.textContent = 'No path found.'; return; }
      pathChain = res.path.map(id => `code:${id}`);
      if (status) status.textContent = `Path (${pathChain.length} hops).`;
      paintPath();
    }
    function paintPath() { if (!cy || !pathChain) return; const set = new Set(pathChain); cy.batch(() => { cy.elements().removeClass('path-node path-edge'); cy.nodes().forEach(n => { if (set.has(n.id())) n.addClass('path-node'); }); for (let i = 0; i < pathChain.length - 1; i++) { const a = pathChain[i], b = pathChain[i + 1]; cy.edges().forEach(e => { const s = e.data('source'), t = e.data('target'); if ((s === a && t === b) || (s === b && t === a)) e.addClass('path-edge'); }); } }); }

    window.focusNode = (id, _retried = false) => {
      currentFocusNodeId = id;
      if (fg3d) { const n = fg3d.graphData().nodes.find(x => x.id === id); if (n) { showNodeDetail(id); applyNeighborhoodMode(id); fg3d.cameraPosition({ x: n.x || 0, y: n.y || 0, z: (n.z || 0) + 200 }, n, 700); } return; }
      if (!cy) return;
      let node = cy.getElementById(id);
      // In Map overview the individual node isn't on screen — drill into its
      // group first, then center on it.
      if ((!node || !node.length)) {
        const raw = allData.nodes.find(x => x.id === id);
        // one-shot retry only — if the node is still absent after drilling (e.g.
        // filtered out by a type/layer toggle), stop instead of looping forever.
        if (raw && currentViewMode === 'map' && !_retried) {
          drillInto(groupKeyFor(raw));
          setTimeout(() => focusNode(id, true), 240);
          return;
        }
      }
      if (node && node.length) { cy.animate({ center: { eles: node }, zoom: 1.6 }, { duration: 350 }); node.select(); showNodeDetail(id); applyNeighborhoodMode(id); }
    };

    // ───────────────────────── intelligence overlays (preserved) ─────────────────────────
    let intelligenceData = null;
    const intelligenceLayerColorById = new Map(), intelligenceLayerNameById = new Map(), intelligenceFileByPath = new Map();
    function applyIntelligence(intel) {
      intelligenceData = intel; intelligenceLayerColorById.clear(); intelligenceLayerNameById.clear(); intelligenceFileByPath.clear();
      if (intel?.architecture?.layers) for (const l of intel.architecture.layers) { intelligenceLayerColorById.set(l.id, l.color); intelligenceLayerNameById.set(l.id, l.name); }
      if (intel?.semanticFiles?.files) for (const f of intel.semanticFiles.files) intelligenceFileByPath.set(f.path, f);
    }
    function intelligenceColorFor(nodeData) { if (!intelligenceData?.architecture) return null; if (nodeData?.layer && nodeData.layer !== 'code') return null; const fp = nodeData?.file_path; if (!fp) return null; const asg = intelligenceData.architecture.assignments?.[fp]; if (!asg) return null; return intelligenceLayerColorById.get(asg.layerId) || null; }
    function intelligenceLayerLabelFor(filePath) { if (!intelligenceData?.architecture) return null; const asg = intelligenceData.architecture.assignments?.[filePath]; if (!asg) return null; const name = intelligenceLayerNameById.get(asg.layerId) || asg.layerId; return { name, layerId: asg.layerId, confidence: asg.confidence, reason: asg.reason }; }

    // ───────────────────────── legend ─────────────────────────
    function buildLegend() {
      const el = $('legend');
      el.innerHTML = `<div class="lg-head" id="lg-head"><span>Legend</span><span id="lg-tog">▾</span></div><div class="lg-body">
        <div class="lg-title">Node types</div>
        <div class="item"><div class="swatch dot" style="background:#58a6ff"></div> Function / Method</div>
        <div class="item"><div class="swatch dot" style="background:#f0883e"></div> Class / Type</div>
        <div class="item"><div class="swatch dot" style="background:#3fb950"></div> File / Module / Doc</div>
        <div class="item"><div class="swatch dot" style="background:#d29922"></div> External</div>
        <div class="item"><div class="swatch dot" style="background:#bc8cff;clip-path:polygon(50% 0,0 100%,100% 100%)"></div> ShaderBinding</div>
        <div class="item"><div class="swatch" style="background:#58a6ff;border-radius:4px"></div> Feature &nbsp;<div class="swatch" style="background:#d29922;transform:rotate(45deg);margin-left:4px"></div> Task</div>
        <div class="lg-title">Edges</div>
        <div class="item"><div class="line" style="border-color:#3fb950"></div> Call — LSP-verified (solid)</div>
        <div class="item"><div class="line" style="border-color:#8b949e;border-top-style:dashed"></div> Call — heuristic (dashed)</div>
        <div class="item"><div class="line" style="border-color:#58a6ff;border-top-style:dashed"></div> Curated cross-layer</div>
        <div class="item"><div class="line" style="border-color:#7ee787;border-top-style:dotted"></div> Inferred cross-layer</div>
        <div class="lg-title">Map</div>
        <div class="item"><div class="swatch" style="background:#1f6feb;border-radius:4px;opacity:.6"></div> Group box — dbl-click to expand</div>
        <div class="item"><div class="swatch dot" style="background:#da3633"></div> Blast: changed &nbsp;<div class="swatch dot" style="background:#d29922;margin-left:4px"></div> affected</div>
      </div>`;
      $('lg-head').addEventListener('click', () => { el.classList.toggle('collapsed'); $('lg-tog').textContent = el.classList.contains('collapsed') ? '▸' : '▾'; });
    }

    // ───────────────────────── search dropdown ─────────────────────────
    let searchTimer = null, searchSel = -1, searchHits = [];
    function renderSearchResults() {
      const box = $('search-results');
      if (!searchHits.length) { box.style.display = 'none'; return; }
      box.innerHTML = searchHits.map((h, i) => `<div class="sr ${i === searchSel ? 'sel' : ''}" data-i="${i}">${h.label} <div class="sr-sub">${(h.type || h.kind || '').toLowerCase()} ${h.file_path ? '· ' + h.file_path : ''}</div></div>`).join('');
      box.style.display = 'block';
      box.querySelectorAll('.sr').forEach(el => el.addEventListener('click', () => pickSearch(+el.dataset.i)));
    }
    function pickSearch(i) {
      const h = searchHits[i]; if (!h) return;
      $('search-results').style.display = 'none';
      $('search').value = h.label;
      const id = (h.layer && String(h.id).includes(':')) ? h.id : `code:${h.id}`;
      focusNode(id);
    }

    // ───────────────────────── canvas tools ─────────────────────────
    function wireCanvasTools() {
      $('t-fit').addEventListener('click', () => { if (cy) cy.fit(undefined, 40); else if (fg3d?.zoomToFit) fg3d.zoomToFit(700, 80); });
      // PNG export of the current view (borrow idea: understand-anything ExportMenu;
      // uses cytoscape's native cy.png / the 3D renderer's canvas).
      $('t-export').addEventListener('click', () => {
        try {
          let url = null;
          if (cy) url = cy.png({ full: true, scale: 2, bg: getComputedStyle(document.body).backgroundColor || '#0d1117' });
          else if (fg3d && fg3d.renderer) url = fg3d.renderer().domElement.toDataURL('image/png');
          if (!url) return;
          const a = document.createElement('a');
          a.href = url; a.download = 'aify-project-graph.png'; a.click();
        } catch { /* export is best-effort */ }
      });
      $('t-zin').addEventListener('click', () => { if (cy) cy.zoom({ level: cy.zoom() * 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } }); });
      $('t-zout').addEventListener('click', () => { if (cy) cy.zoom({ level: cy.zoom() / 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } }); });
      // The discrete +/- zoom buttons only drive the 2D cytoscape canvas; 3D uses
      // scroll-zoom + Fit, so hide them in 3D (mode-appropriate controls).
      if (is3DMode) { $('t-zin').style.display = 'none'; $('t-zout').style.display = 'none'; }
      $('t-collapse').title = 'Back to Map overview';
      $('t-collapse').textContent = '⊖';
      $('t-collapse').addEventListener('click', () => { drilledGroup = null; setView('map'); });
      document.addEventListener('keydown', (e) => { if (e.key === 'f' && document.activeElement.tagName !== 'INPUT') { if (cy) cy.fit(undefined, 40); } });
    }

    // ───────────────────────── render orchestrator ─────────────────────────
    function renderGraph(resetFocus = false) {
      if (resetFocus) currentFocusNodeId = null;
      loading(true, 'Laying out…');
      // defer so the spinner paints before the (sync) layout work
      setTimeout(() => {
        try { if (is3DMode) render3D(); else render2D(); }
        finally { loading(false); }
        // expand/collapse buttons only meaningful inside a drilled Map group
        const showEC = !is3DMode && currentViewMode === 'map' && drilledGroup;
        $('t-expand').style.display = 'none';
        $('t-collapse').style.display = showEC ? 'flex' : 'none';
        // Heavy-render notice: tell the user when the view was capped (and how to see all).
        const note = $('cap-note');
        if (note) {
          if (lastRenderCap.capped > 0) {
            note.textContent = `Showing top ${(lastRenderCap.total - lastRenderCap.capped).toLocaleString()} of ${lastRenderCap.total.toLocaleString()} nodes (by degree) — filter by type/layer or switch to the grouped Map to see all.`;
            note.style.display = 'block';
          } else { note.style.display = 'none'; }
        }
      }, 16);
    }

    // ───────────────────────── Guided Tour ─────────────────────────
    // Borrow: understand-anything LearnPanel. Ordered orientation steps from
    // /api/tour (entrypoints → archetype regions → hotspots); each step's refs
    // become click-to-focus pills (resolved label→node via /api/search).
    const tourEsc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const __tour = { steps: [], i: 0 };
    async function tourFocusLabel(label) {
      try {
        const hits = await fetch(`/api/search?q=${encodeURIComponent(label)}`).then(r => r.json()).catch(() => []);
        if (Array.isArray(hits) && hits.length && window.focusNode) window.focusNode(hits[0].id);
      } catch { /* best effort */ }
    }
    function renderTour() {
      const panel = document.getElementById('tour-panel');
      const s = __tour.steps[__tour.i];
      if (!s) { panel.innerHTML = '<div class="tour-head">🧭 Guided Tour<button class="tour-x" id="tour-close" type="button">✕</button></div><div class="tour-why">No tour available — is the graph empty?</div>'; panel.querySelector('#tour-close').onclick = closeTour; return; }
      const pills = (s.refs || []).map((l) => `<button class="tour-pill" type="button" data-label="${tourEsc(l)}">${tourEsc(l)}</button>`).join('');
      panel.innerHTML = `
        <div class="tour-head">🧭 Guided Tour <span class="tour-prog">${__tour.i + 1}/${__tour.steps.length}</span><button class="tour-x" id="tour-close" type="button">✕</button></div>
        <div class="tour-title">${tourEsc(s.title)}</div>
        <div class="tour-why">${tourEsc(s.why)}</div>
        <div class="tour-pills">${pills}</div>
