        ${s.verb ? `<div class="tour-verb">try: <code>${tourEsc(s.verb)}</code></div>` : ''}
        <div class="tour-nav"><button id="tour-prev" type="button" ${__tour.i === 0 ? 'disabled' : ''}>← prev</button><button id="tour-next" type="button" ${__tour.i >= __tour.steps.length - 1 ? 'disabled' : ''}>next →</button></div>`;
      panel.querySelector('#tour-close').onclick = closeTour;
      panel.querySelector('#tour-prev').onclick = () => { if (__tour.i > 0) { __tour.i--; renderTour(); } };
      panel.querySelector('#tour-next').onclick = () => { if (__tour.i < __tour.steps.length - 1) { __tour.i++; renderTour(); } };
      panel.querySelectorAll('.tour-pill').forEach((b) => { b.onclick = () => tourFocusLabel(b.dataset.label); });
    }
    function closeTour() { document.getElementById('tour-panel').style.display = 'none'; }
    async function openTour() {
      const panel = document.getElementById('tour-panel');
      if (!__tour.steps.length) {
        const data = await fetch('/api/tour?steps=8').then(r => r.json()).catch(() => ({ steps: [] }));
        __tour.steps = (data && data.steps) || [];
      }
      __tour.i = 0;
      panel.style.display = 'block';
      renderTour();
    }

    // ─────────────────── file-tree explorer ───────────────────
    // Borrow: understand-anything FileExplorer. A collapsible folder→file tree
    // built client-side from the file_paths already present on graph nodes (the
    // graph IS the allowlist), so no new endpoint is needed. Clicking a file
    // focuses its node, reusing focusNode() + the existing source viewer.
    function buildFileTree() {
      const root = { dirs: new Map(), files: [] };
      const seen = new Set();
      for (const n of (allData.nodes || [])) {
        const fp = n.file_path;
        if (!fp || seen.has(fp)) continue;
        seen.add(fp);
        const parts = String(fp).split('/');
        let cur = root;
        for (let i = 0; i < parts.length - 1; i++) {
          const d = parts[i];
          if (!cur.dirs.has(d)) cur.dirs.set(d, { dirs: new Map(), files: [] });
          cur = cur.dirs.get(d);
        }
        cur.files.push({ name: parts[parts.length - 1], path: fp });
      }
      return root;
    }
    function fileTreeFocus(path) {
      // Prefer the File node for this path; fall back to the first node in it.
      const nodes = allData.nodes || [];
      const node = nodes.find((n) => n.type === 'File' && n.file_path === path)
        || nodes.find((n) => n.file_path === path);
      if (node && window.focusNode) window.focusNode(node.id);
    }
    function renderFileTree(node, depth, out) {
      const dirs = [...node.dirs.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      for (const [name, sub] of dirs) {
        const collapsed = depth >= 1; // top level open, deeper levels collapsed
        out.push(`<div class="ftree-row ftree-dir" style="padding-left:${depth * 12}px"><span class="ftree-tw">${collapsed ? '▸' : '▾'}</span>${tourEsc(name)}/</div>`);
        const childOut = [];
        renderFileTree(sub, depth + 1, childOut);
        out.push(`<div class="ftree-children" style="display:${collapsed ? 'none' : 'block'}">${childOut.join('')}</div>`);
      }
      for (const f of [...node.files].sort((a, b) => a.name.localeCompare(b.name))) {
        out.push(`<div class="ftree-row ftree-file" data-path="${tourEsc(f.path)}" style="padding-left:${depth * 12 + 12}px" title="${tourEsc(f.path)}">${tourEsc(f.name)}</div>`);
      }
    }
    function closeFiles() { document.getElementById('files-panel').style.display = 'none'; }
    function openFiles() {
      const panel = document.getElementById('files-panel');
      const tree = buildFileTree();
      const out = [];
      renderFileTree(tree, 0, out);
      const body = out.length ? out.join('') : '<div class="tour-why">No files in the graph yet.</div>';
      panel.innerHTML = `<div class="tour-head">📁 Files<button class="tour-x" id="files-close" type="button">✕</button></div>${body}`;
      panel.style.display = 'block';
      panel.querySelector('#files-close').onclick = closeFiles;
      panel.querySelectorAll('.ftree-dir').forEach((el) => {
        el.onclick = () => {
          const kids = el.nextElementSibling;
          if (kids && kids.classList.contains('ftree-children')) {
            const open = kids.style.display !== 'none';
            kids.style.display = open ? 'none' : 'block';
            el.querySelector('.ftree-tw').textContent = open ? '▸' : '▾';
          }
        };
      });
      panel.querySelectorAll('.ftree-file').forEach((el) => { el.onclick = () => fileTreeFocus(el.dataset.path); });
    }

    // ───────────────────────── init ─────────────────────────
    async function init() {
      loading(true, 'Fetching graph…');
      const [graphData, stats, intel, provenance, archetypes] = await Promise.all([
        fetch('/api/graph-multilayer').then(r => r.json()).catch(() => fetch('/api/graph').then(r => r.json())),
        fetch('/api/stats').then(r => r.json()).catch(() => ({ nodeCount: 0, edgeCount: 0, types: [], relations: [] })),
        fetch('/api/intelligence').then(r => r.json()).catch(() => ({ semanticFiles: null, architecture: null, layerSummary: [], warnings: [] })),
        fetch('/api/provenance').then(r => r.json()).catch(() => null),
        fetch('/api/archetypes').then(r => r.json()).catch(() => ({ archetypes: {} })),
      ]);
      archetypeMap = archetypes?.archetypes || {};
      applyIntelligence(intel);
      allData = graphData;
      window.__lastStats = stats; window.__provenance = provenance;
      if (is3DMode) currentViewMode = 'map';
      $('mode-label').textContent = is3DMode ? '3D map' : '2D map';
      $('mode-link').href = is3DMode ? '/' : '/3d';
      $('mode-link').textContent = is3DMode ? 'open 2D' : 'open 3D';

      renderStats(graphData, stats);
      buildControls(graphData);
      buildLegend();
      wireCanvasTools();
      renderIdleOverview(stats);

      $('sidebar-toggle').addEventListener('click', () => setSidebarCollapsed(true));
      $('sidebar-reopen').addEventListener('click', () => setSidebarCollapsed(false));
      $('tour-btn').addEventListener('click', () => {
        const panel = document.getElementById('tour-panel');
        if (panel.style.display === 'none' || !panel.style.display) { closeFiles(); openTour(); } else closeTour();
      });
      $('files-btn').addEventListener('click', () => {
        const panel = document.getElementById('files-panel');
        if (panel.style.display === 'none' || !panel.style.display) { closeTour(); openFiles(); } else closeFiles();
      });

      const searchEl = $('search');
      searchEl.addEventListener('input', (e) => {
        const q = e.target.value.trim();
        clearTimeout(searchTimer);
        if (q.length < 2) { $('search-results').style.display = 'none'; searchHits = []; return; }
        searchTimer = setTimeout(async () => {
          searchHits = await fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []);
          searchSel = -1; renderSearchResults();
        }, 160);
      });
      searchEl.addEventListener('keydown', (e) => {
        if (!searchHits.length) return;
        if (e.key === 'ArrowDown') { searchSel = Math.min(searchHits.length - 1, searchSel + 1); renderSearchResults(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { searchSel = Math.max(0, searchSel - 1); renderSearchResults(); e.preventDefault(); }
        else if (e.key === 'Enter') { pickSearch(searchSel >= 0 ? searchSel : 0); e.preventDefault(); }
        else if (e.key === 'Escape') { $('search-results').style.display = 'none'; }
      });
      document.addEventListener('click', (e) => { if (!$('search-box').contains(e.target)) $('search-results').style.display = 'none'; });

      renderGraph(true);
    }
    init();
  </script>
</body>
</html>
